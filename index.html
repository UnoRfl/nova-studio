<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%238b5cf6'/><stop offset='1' stop-color='%23ec4899'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><path d='M9 23V9l14 14V9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gfonts" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header id="topbar">
  <div class="brand" id="homeBtn" title="Your designs"><span class="logo"></span>Nova Studio</div>
  <button class="tb" id="newBtn" title="New design">New</button>
  <button class="tb" id="resizeBtn" title="Resize design">Resize</button>
  <div class="sep"></div>
  <button class="tb icon" id="undoBtn" title="Undo (Ctrl+Z)" data-i="undo"></button>
  <button class="tb icon" id="redoBtn" title="Redo (Ctrl+Y)" data-i="redo"></button>
  <span id="saveState" class="muted small"></span>
  <div class="grow"></div>
  <input id="docName" class="docname" spellcheck="false" title="Design name">
  <div class="grow"></div>
  <button class="tb" id="openBtn" title="Open .nova project file">Open</button>
  <button class="tb" id="saveBtn" title="Save project file">Save file</button>
  <button class="tb primary" id="exportBtn">Download</button>
</header>

<div id="main">
  <nav id="rail"></nav>
  <aside id="panel"><div id="panelBody"></div></aside>
  <section id="center">
    <div id="workspace"><div id="stage"><canvas id="c"></canvas></div></div>
    <div id="bottombar">
      <div id="pages"></div>
      <div class="zoom">
        <button class="tb icon" id="zoomOut" data-i="minus" title="Zoom out"></button>
        <button class="tb" id="zoomVal" title="Fit">100%</button>
        <button class="tb icon" id="zoomIn" data-i="plus" title="Zoom in"></button>
      </div>
    </div>
  </section>
  <aside id="props"></aside>
</div>

<div id="ctx" class="menu hidden"></div>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileImg" accept="image/*,.svg" multiple hidden>
<input type="file" id="fileProj" accept=".nova,.json,application/json" hidden>

<script src="lib/fabric.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
